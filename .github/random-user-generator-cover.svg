<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Random User Generator for MyBB</title>
  <desc id="desc">An Admin CP plugin for generating MyBB accounts with customizable usernames, name sources, local fallback, and avatar styles.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10152b"/>
      <stop offset="1" stop-color="#202c51"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#77e4c2"/>
      <stop offset="1" stop-color="#61a9ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#080b18" flood-opacity=".35"/>
    </filter>
  </defs>
  <rect width="1200" height="630" rx="28" fill="url(#background)"/>
  <circle cx="1060" cy="90" r="190" fill="#4d73c7" opacity=".12"/>
  <circle cx="1100" cy="580" r="220" fill="#57d6b3" opacity=".08"/>
  <g opacity=".12" fill="#fff">
    <circle cx="102" cy="100" r="3"/><circle cx="146" cy="100" r="3"/><circle cx="190" cy="100" r="3"/>
    <circle cx="102" cy="144" r="3"/><circle cx="146" cy="144" r="3"/><circle cx="190" cy="144" r="3"/>
    <circle cx="102" cy="188" r="3"/><circle cx="146" cy="188" r="3"/><circle cx="190" cy="188" r="3"/>
  </g>
  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">
    <rect x="76" y="66" width="234" height="38" rx="19" fill="#ffffff" fill-opacity=".09" stroke="#ffffff" stroke-opacity=".15"/>
    <circle cx="98" cy="85" r="5" fill="#77e4c2"/>
    <text x="114" y="91" fill="#dce7ff" font-size="14" font-weight="700" letter-spacing="1.5">MYBB ADMIN CP PLUGIN</text>
    <text x="76" y="185" fill="#ffffff" font-size="54" font-weight="800" letter-spacing="-1.6">Random User</text>
    <text x="76" y="246" fill="#ffffff" font-size="54" font-weight="800" letter-spacing="-1.6">Generator</text>
    <text x="80" y="292" fill="#aebcdd" font-size="20">Create test accounts with names, styles, and avatars</text>
    <text x="80" y="320" fill="#aebcdd" font-size="20">— right from your MyBB Admin CP.</text>
    <g transform="translate(80 370)">
      <rect width="157" height="45" rx="12" fill="#ffffff" fill-opacity=".08" stroke="#ffffff" stroke-opacity=".12"/>
      <text x="17" y="29" fill="#e6edff" font-size="14" font-weight="650">1–100 accounts</text>
      <rect x="170" width="155" height="45" rx="12" fill="#ffffff" fill-opacity=".08" stroke="#ffffff" stroke-opacity=".12"/>
      <text x="187" y="29" fill="#e6edff" font-size="14" font-weight="650">7 username styles</text>
      <rect x="338" width="145" height="45" rx="12" fill="#ffffff" fill-opacity=".08" stroke="#ffffff" stroke-opacity=".12"/>
      <text x="355" y="29" fill="#e6edff" font-size="14" font-weight="650">Local fallback</text>
    </g>
    <g transform="translate(810 124)" filter="url(#shadow)">
      <rect width="316" height="370" rx="24" fill="#f7f9ff"/>
      <path d="M0 24Q0 0 24 0H292Q316 0 316 24V62H0Z" fill="#e9eef9"/>
      <circle cx="26" cy="31" r="5" fill="#fa7d7d"/><circle cx="45" cy="31" r="5" fill="#f5c45b"/><circle cx="64" cy="31" r="5" fill="#68c99a"/>
      <text x="24" y="96" fill="#1d2942" font-size="16" font-weight="750">Generate accounts</text>
      <text x="24" y="125" fill="#76839c" font-size="12" font-weight="650" letter-spacing=".7">USERNAME STYLE</text>
      <rect x="24" y="139" width="268" height="44" rx="10" fill="#fff" stroke="#dce3f0"/>
      <text x="40" y="167" fill="#263653" font-size="14">Creative mix</text>
      <path d="m269 157 6 6 6-6" fill="none" stroke="#7886a0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="24" y="215" fill="#76839c" font-size="12" font-weight="650" letter-spacing=".7">NAME SOURCE</text>
      <rect x="24" y="229" width="268" height="44" rx="10" fill="#fff" stroke="#dce3f0"/>
      <circle cx="43" cy="251" r="7" fill="#61b99d"/>
      <text x="59" y="256" fill="#263653" font-size="14">Public API + local fallback</text>
      <rect x="24" y="298" width="268" height="48" rx="12" fill="url(#accent)"/>
      <text x="158" y="328" text-anchor="middle" fill="#10243d" font-size="15" font-weight="800">CREATE USERS</text>
    </g>
    <text x="80" y="567" fill="#8292b7" font-size="15" font-weight="600">RANDOM USER GENERATOR FOR MYBB</text>
    <text x="1120" y="567" text-anchor="end" fill="#8292b7" font-size="15" font-weight="600">MyBB 1.8 · PHP 7+</text>
  </g>
</svg>
